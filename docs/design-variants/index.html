<title>ARCANA — варианты дизайна</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,500&family=Forum&family=Golos+Text:wght@400;500;600;700&family=Manrope:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,700;0,900;1,500;1,700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: one dark workbench. A slim top bar picks what is compared (app / graphs) and
   which variant; below it the specimen takes the stage with its notes beside it. */
:root {
  color-scheme: dark;
  --ink: #14100d;        /* workbench ground, a shade under the app's own background */
  --bg: #1a1613;         /* ARCANA background */
  --surface: #241f1a;
  --raised: #2f2820;
  --line: #4a3f30;
  --text: #f3ece0;
  --muted: #b8a99a;
  --gold: #d4af6a;
  --gold-dim: #8a7550;
  --rose: #c2938f;
  --wine: #6e2a35;
  --champagne: #e9d9b8;
  --font-ui: "Golos Text", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
}
html, body { height: 100%; }
body { background: var(--ink); color: var(--text); font-family: var(--font-ui); font-size: 15px; line-height: 1.5; }
* { box-sizing: border-box; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
button:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.wrap { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); max-width: 1320px; margin: 0 auto; }

.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: color-mix(in srgb, var(--ink) 92%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--ink); }
.top-row { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; padding-block: 12px; }
.brand { font-family: "Forum", Georgia, serif; letter-spacing: .28em; font-size: 18px; color: var(--gold); }
.brand small { display: block; font-family: var(--font-ui); letter-spacing: .04em; font-size: 11px; color: var(--muted); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 3px; background: var(--bg); }
.seg button { padding: 7px 16px; border-radius: 999px; font-size: 13px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--gold); color: #1a1613; font-weight: 600; }
.variants { display: flex; flex-wrap: wrap; gap: 8px; padding-bottom: 12px; }
.variant { text-align: left; border: 1px solid var(--line); border-radius: 12px; padding: 8px 14px; min-width: 0; flex: 1 1 200px; background: var(--bg); }
.variant b { display: block; font-weight: 600; font-size: 14px; }
.variant span { font-size: 12px; color: var(--muted); }
.variant[aria-pressed="true"] { border-color: var(--gold); background: color-mix(in srgb, var(--gold) 10%, var(--bg)); }
.variant[aria-pressed="true"] b { color: var(--gold); }

.stage { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 28px; padding-block: 24px 48px; align-items: start; }
.stage.graphs { grid-template-columns: minmax(0, 1fr); }
@media (max-width: 900px) { .stage { grid-template-columns: minmax(0, 1fr); } }
.notes { min-width: 0; }
.notes h2 { font-family: "Forum", Georgia, serif; font-weight: 400; font-size: 26px; margin: 0 0 6px; text-wrap: balance; }
.notes p { color: var(--muted); margin: 0 0 14px; max-width: 60ch; }
.notes h3 { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--gold-dim); margin: 18px 0 8px; font-weight: 600; }
.screens { display: flex; flex-wrap: wrap; gap: 6px; }
.screens button { border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; font-size: 13px; color: var(--muted); }
.screens button[aria-pressed="true"] { border-color: var(--gold); color: var(--gold); }
.facts { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; }
.facts li { border-left: 2px solid var(--gold-dim); padding-left: 10px; font-size: 13.5px; color: var(--text); }
.facts li span { display: block; color: var(--muted); font-size: 12.5px; }
.demo-note { font-size: 12px; color: var(--muted); border: 1px dashed var(--line); border-radius: 8px; padding: 8px 10px; margin-top: 18px; }

.phone-zone { display: flex; justify-content: center; min-width: 0; }
.phone { --w: 340px; width: var(--w); max-width: 100%; aspect-ratio: 9 / 19.2; border-radius: 42px; padding: 10px; background: #0b0908; border: 1px solid #3a3128; box-shadow: 0 30px 80px rgba(0,0,0,.6), inset 0 0 0 1px rgba(212,175,106,.08); position: relative; }
.phone::before { content: ""; position: absolute; top: 18px; left: 50%; width: 78px; height: 20px; transform: translateX(-50%); border-radius: 12px; background: #000; z-index: 9; }
.screen { position: relative; width: 100%; height: 100%; border-radius: 33px; overflow: hidden; background: var(--bg); container-type: inline-size; }
.screen * { scrollbar-width: none; }
.screen ::-webkit-scrollbar { display: none; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>

<header class="top">
  <div class="wrap">
    <div class="top-row">
      <div class="brand">ARCANA<small>варианты дизайна · выберите, что нравится</small></div>
      <div class="seg" role="group" aria-label="Что сравниваем">
        <button id="tab-app" aria-pressed="true">Приложение</button>
        <button id="tab-graph" aria-pressed="false">Графы сюжета</button>
      </div>
    </div>
    <div class="variants" id="variants" role="group" aria-label="Вариант"></div>
  </div>
</header>

<main class="wrap">
  <div class="stage" id="stage"></div>
</main>

<script src="app-variants.js"></script>
<script src="graph-variants.js"></script>
<script>
(function () {
  const state = { mode: "app", app: 0, graph: 0, screen: "home" };
  const stage = document.getElementById("stage");
  const variantsEl = document.getElementById("variants");
  const tabs = { app: document.getElementById("tab-app"), graph: document.getElementById("tab-graph") };

  function parseHash() {
    const m = /^#(app|graph)-([1-3])$/.exec(location.hash);
    if (m) { state.mode = m[1]; state[m[1]] = Number(m[2]) - 1; }
  }
  function setHash() {
    const next = `#${state.mode}-${state[state.mode] + 1}`;
    if (location.hash !== next) history.replaceState(null, "", next);
  }

  function render() {
    tabs.app.setAttribute("aria-pressed", String(state.mode === "app"));
    tabs.graph.setAttribute("aria-pressed", String(state.mode === "graph"));
    const list = state.mode === "app" ? window.ArcanaApp.variants : window.ArcanaGraph.themes;
    variantsEl.innerHTML = list.map((v, i) =>
      `<button class="variant" data-i="${i}" aria-pressed="${i === state[state.mode]}"><b>${i + 1}. ${v.name}</b><span>${v.tagline}</span></button>`).join("");
    stage.className = "stage" + (state.mode === "graph" ? " graphs" : "");
    if (state.mode === "app") window.ArcanaApp.mount(stage, state.app, state.screen, (s) => { state.screen = s; });
    else window.ArcanaGraph.mount(stage, state.graph);
    setHash();
  }

  variantsEl.addEventListener("click", (e) => {
    const b = e.target.closest(".variant"); if (!b) return;
    state[state.mode] = Number(b.dataset.i); render();
  });
  tabs.app.addEventListener("click", () => { state.mode = "app"; render(); });
  tabs.graph.addEventListener("click", () => { state.mode = "graph"; render(); });
  window.addEventListener("hashchange", () => { parseHash(); render(); });
  parseHash(); render();
})();
</script>
